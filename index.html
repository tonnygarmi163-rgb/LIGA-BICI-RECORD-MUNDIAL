<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Liga Bici</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f0f0f0;--white:#fff;--black:#0b0b0c;--red:#e02020;--blue:#1e40ff;--yellow:#f5c800;--green:#16a34a;--orange:#f97316;--gray1:#f8f8f8;--gray2:#e8e8e8;--gray3:#d0d0d0;--gray4:#a0a0a0;--gray5:#555;--nav-h:64px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--black);min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.loading-screen{position:fixed;inset:0;background:#000;z-index:99999;overflow:hidden;transition:opacity .8s,visibility .8s}
.loading-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-video-container{position:absolute;inset:0;overflow:hidden}
.loading-video-container video{position:absolute;top:50%;left:50%;min-width:100%;min-height:100%;transform:translate(-50%,-50%);object-fit:cover}
.skip-btn{position:fixed;bottom:40px;right:40px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;border:2px solid rgba(255,255,255,.5);padding:12px 30px;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer;z-index:100000;text-transform:uppercase;letter-spacing:1px}
.sound-btn{position:fixed;bottom:40px;left:40px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;border:2px solid rgba(255,255,255,.5);padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer;z-index:100000}
.screen{display:none;min-height:100vh;padding-bottom:calc(var(--nav-h) + 24px)}.screen.active{display:block}
.season-switcher{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 14px 0;position:sticky;top:0;z-index:100;background:var(--bg)}
.season-card{background:var(--gray2);border:none;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer}
.season-card.active{background:var(--black);color:var(--white)}
.season-card .season-kicker{font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.6;display:block;margin-bottom:2px}
.season-card strong{display:block;font-size:14px;font-weight:800}
.season-card span{font-size:12px;opacity:.7}
.brand-panel{background:var(--white);border-radius:12px;margin:12px 14px 0;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.brand-logo{width:60px;height:60px;background:var(--black);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo svg{width:44px;height:44px}
.brand-info .eyebrow{font-size:11px;color:var(--gray4);letter-spacing:2px;text-transform:uppercase;font-weight:600}
.brand-info h1{font-size:22px;font-weight:900}
.brand-info .season-summary{font-size:12px;color:var(--gray5);margin-top:3px}
.cd-box{margin:10px 14px 0;background:linear-gradient(135deg,#0b0b0c,#1e40ff);border-radius:12px;padding:14px;color:#fff}
.cd-title{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.75}
.cd-name{font-size:16px;font-weight:900;margin-top:2px}
.cd-time{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:6px}
.cd-sub{font-size:11px;opacity:.75;margin-top:2px}
.quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 14px 0}
.qs-box{background:var(--white);border-radius:10px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.qs-val{font-size:20px;font-weight:900}.qs-lbl{font-size:9px;color:var(--gray4);text-transform:uppercase;margin-top:1px}
.section-block{margin:14px 14px 0}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-heading h2{font-size:16px;font-weight:800}
.text-link{background:none;border:none;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer}
.event-item{background:var(--white);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.ei-name{font-size:14px;font-weight:700}.ei-date{font-size:12px;color:var(--gray4);margin-top:2px}
.ei-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.status-done{color:var(--green);background:#dcfce7}.status-next{color:var(--blue);background:#dbeafe}.status-pend{color:var(--gray4);background:var(--gray2)}
.leader-item{background:var(--white);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.li-pos{font-size:20px;font-weight:900;width:24px;text-align:center}.li-bar{width:3px;height:36px;border-radius:2px}.li-name{flex:1;font-size:14px;font-weight:700}.li-pts{font-size:22px;font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--black);display:flex;height:var(--nav-h);z-index:200;border-top:1px solid #222;overflow-x:auto}
.nav-button{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:#888;font-size:8px;font-weight:600;cursor:pointer;padding:6px 2px;text-transform:uppercase;min-height:48px}
.nav-button.active{color:var(--white)}.nav-button svg{width:20px;height:20px}
.view-header{padding:20px 14px 10px}
.view-header .eyebrow{font-size:11px;color:var(--gray4);letter-spacing:2px;text-transform:uppercase;font-weight:600}
.view-header h1{font-size:26px;font-weight:900;margin-top:2px}
.search-bar{margin:0 14px 10px;position:relative}
.search-bar input{width:100%;padding:10px 14px 10px 36px;border:2px solid var(--gray2);border-radius:10px;font-size:14px;background:var(--white);outline:none}
.search-bar svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gray4)}
.participant-card{background:var(--white);border-radius:12px;margin:0 14px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
.pc-photo{height:150px;overflow:hidden;background:var(--gray2)}
.pc-photo img{width:100%;height:100%;object-fit:cover;display:block}
.pc-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.pc-kicker{font-size:11px;font-weight:600;opacity:.85}.pc-name{font-size:24px;font-weight:900}.pc-dorsal{font-size:32px;font-weight:900;opacity:.4}
.pc-stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--gray2)}
.pc-stat{padding:10px 4px;text-align:center;border-right:1px solid var(--gray2)}.pc-stat:last-child{border-right:none}
.pc-sv{font-size:16px;font-weight:900}.pc-sl{font-size:8px;color:var(--gray4);text-transform:uppercase;margin-top:2px}
.standing-row{background:var(--white);border-radius:10px;margin:0 14px 8px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid;cursor:pointer}
.sr-num{width:32px;height:32px;border-radius:50%;background:var(--black);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.sr-info{flex:1}.sr-name{font-size:16px;font-weight:800}.sr-diff{font-size:12px;color:var(--gray4)}.sr-pts{font-size:26px;font-weight:900}
.score-section{margin:14px 14px 0}
.score-player{background:var(--white);border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sp-header{padding:12px 16px;display:flex;justify-content:space-between}.sp-name{font-size:16px;font-weight:800}.sp-total{font-size:22px;font-weight:900}
.sp-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-top:1px solid var(--gray2)}
.spr-circ{font-size:13px}.spr-right{display:flex;align-items:center;gap:8px}
.tag-carrera{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.tag-tiempos{background:var(--yellow);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.tag-practica{background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.tag-recup{background:#a855f7;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.spr-pts{font-size:13px;font-weight:800}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.filter-pill{background:var(--gray2);border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--gray5);min-height:36px}
.filter-pill.active{background:var(--black);color:var(--white)}
.earth-banner{margin:0 14px 12px;background:linear-gradient(135deg,#1e40ff,#0b0b0c);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.earth-banner .eb-txt{color:#fff;font-size:13px;font-weight:700}
.earth-banner .eb-sub{color:#cfd8ff;font-size:11px;font-weight:400;display:block;margin-top:2px}
.earth-banner button{background:#4285f4;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.circ-card{background:var(--white);border-radius:12px;margin:0 14px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
.circ-header-bar{padding:10px 14px 8px;display:flex;justify-content:space-between}
.ch-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.ch-badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px;text-transform:uppercase}
.badge-circuit{background:var(--red);color:#fff}
.circ-drawing{height:200px;background:var(--gray1);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.circ-drawing img{width:100%;height:100%;object-fit:contain;padding:8px}
.circ-info{padding:10px 14px}
.ci-name{font-size:18px;font-weight:900}.ci-record{font-size:13px;color:var(--gray4);float:right}
.ci-desc{font-size:12px;color:var(--gray5);margin-top:4px}
.ci-elev{font-size:11px;color:var(--gray4);margin-top:4px}
.ci-summary{font-size:11px;color:var(--blue);margin-top:6px;font-style:italic}
.ci-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ci-tag{font-size:10px;font-weight:700;padding:3px 10px;border-radius:6px;text-transform:uppercase}
.tag-tranquilo{background:#dcfce7;color:#15803d}.tag-coches{background:#fef9c3;color:#854d0e}.tag-peatones{background:#dbeafe;color:#1e40af}
.tag-dif-media{background:#f3f4f6;color:#374151}.tag-dif-alta{background:#fee2e2;color:#b91c1c}.tag-dif-baja{background:#f0fdf4;color:#15803d}
.tag-riesgo-bajo{background:#f0fdf4;color:#15803d}.tag-riesgo-medio{background:#fff7ed;color:#c2410c}.tag-riesgo-alto{background:#fee2e2;color:#b91c1c}
.hor-item{background:var(--white);border-radius:12px;margin:0 14px 10px;display:flex;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hi-date{background:var(--black);color:#fff;width:64px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px}
.hi-day{font-size:22px;font-weight:900}.hi-month{font-size:10px;text-transform:uppercase;opacity:.7}
.hi-body{flex:1;padding:12px 14px}.hi-name{font-size:15px;font-weight:800}.hi-sub{font-size:12px;color:var(--gray5)}
.hi-actions{display:flex;gap:8px;margin-top:10px}
.btn-carrera{background:var(--red);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer}
.btn-practica{background:var(--green);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer}
.btn-tiempos{background:var(--yellow);color:#000;border:none;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer}
.btn-ver-circ{background:var(--black);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer}
.hi-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;align-self:flex-start;margin:12px 10px 0 0}
.info-tabs{display:flex;margin:0 14px 14px;background:var(--gray2);border-radius:10px;padding:3px}
.info-tab{flex:1;background:none;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--gray5);min-height:36px}
.info-tab.active{background:var(--white);color:var(--black)}
.info-panel{margin:0 14px}
.norma-section{background:var(--white);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ns-title{font-size:14px;font-weight:800;margin-bottom:8px}
.ns-body{font-size:13px;color:var(--gray5);line-height:1.65}
.ns-body ul{padding-left:18px;margin-top:6px}
.ns-pole{background:#fefce8;border-left:3px solid #ca8a04;padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px}
.ns-nocasa{background:#fee2e2;border-left:3px solid var(--red);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px}
.ns-time{background:#dbeafe;border-left:3px solid var(--blue);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px}
.comp-section{margin:0 14px 14px}
.comp-table-wrap{overflow-x:auto}
.comp-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--white);border-radius:10px;overflow:hidden}
.comp-table th{background:var(--black);color:#fff;padding:10px 8px;text-align:left;font-size:11px;text-transform:uppercase;white-space:nowrap}
.comp-table td{padding:10px 8px;border-bottom:1px solid var(--gray2)}
.comp-table .bike-label{font-weight:700;font-size:13px}
.noticia-card{background:var(--white);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.noticia-imgwrap{position:relative;height:170px;background:var(--gray2)}
.noticia-imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
.noticia-cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.87);padding:9px 12px}
.noticia-cap .nc-title{color:#fff;font-size:13px;font-weight:700;line-height:1.3}
.noticia-cap .nc-date{color:#cfcfcf;font-size:10px;margin-top:3px}
.news-img{width:calc(100% - 32px);margin:0 16px 14px;height:230px;object-fit:cover;border-radius:8px;display:block}
.news-txt{padding:0 16px 12px;font-size:13px;color:var(--gray5);line-height:1.6}
.news-datebar{margin:0 16px 20px;background:var(--black);color:#fff;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600}
.vcard{background:var(--white);border-radius:12px;margin:0 0 10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.vcard-thumb{height:200px;display:flex;align-items:center;justify-content:center;background:var(--gray2);font-size:24px}
.vcard-info{padding:10px 14px}.vcard-title{font-size:14px;font-weight:700}.vcard-meta{font-size:12px;color:var(--gray4)}
.detail-dialog{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center}
.detail-dialog.open{display:flex}
.dialog-content{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;position:relative}
.close-btn{position:sticky;top:12px;float:right;background:var(--gray2);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;z-index:10;margin:12px 12px 0 0}
.dlg-player-header{padding:20px 16px 16px}
.dph-eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;opacity:.7}
.dph-name{font-size:26px;font-weight:900;margin-top:4px}
.dlg-bici-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--gray1);border-radius:10px;margin:0 16px 14px;cursor:pointer;border:1.5px solid var(--gray2)}
.dbr-img{width:80px;height:48px;background:var(--gray2);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.dbr-img img{width:100%;height:100%;object-fit:contain}
.dbr-model{font-size:14px;font-weight:700}.dbr-link{font-size:11px;color:var(--blue);font-weight:600}
.dlg-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--gray2);border-radius:10px;overflow:hidden;margin:0 16px 14px}
.dsg-box{background:var(--white);padding:12px}.dsg-val{font-size:20px;font-weight:900}.dsg-lbl{font-size:10px;color:var(--gray4);text-transform:uppercase;margin-top:2px}
.dlg-wins-title{font-size:13px;font-weight:800;color:var(--gray4);letter-spacing:1px;text-transform:uppercase;padding:0 16px;margin:12px 0 8px}
.win-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 16px}
.win-chip{background:var(--gray2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.win-chip .wc-season{font-size:10px;color:var(--gray4);display:block}
.pred-box{margin:0 16px 14px;background:#f5f3ff;border:2px solid #7c3aed;border-radius:12px;padding:14px}
.pred-box h4{font-size:13px;font-weight:800;color:#7c3aed;margin-bottom:8px}
.pred-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px}
.pred-pos{width:26px;font-weight:900}
.pred-name{flex:1;font-weight:700}
.pred-razon{font-size:11px;color:var(--gray5);margin-top:8px;line-height:1.5}
.pred-detalle{font-size:11px;color:#4c1d95;margin-top:6px;line-height:1.5;background:#ede9fe;border-radius:8px;padding:8px}
.consejo-box{margin:0 16px 14px;background:#f0fdf4;border:2px solid var(--green);border-radius:12px;padding:14px;font-size:12px;color:var(--gray5);line-height:1.6}
.consejo-box h4{font-size:13px;font-weight:800;color:var(--green);margin-bottom:6px}
.elev-strip{margin:0 16px 14px;background:var(--gray1);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--gray5)}
.bici-hero{text-align:center;padding:20px 16px 10px;background:var(--gray1)}
.bici-hero img{width:280px;height:180px;object-fit:contain}
.bici-model-title{font-size:20px;font-weight:900;padding:14px 16px 2px}
.bici-type-sub{font-size:13px;color:var(--gray4);padding:0 16px 14px}
.bici-specs{margin:0 16px 10px}
.bici-spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray2)}
.bsr-label{font-size:12px;color:var(--gray4)}.bsr-val{font-size:13px;font-weight:700;text-align:right;max-width:60%}
.bici-price{background:var(--black);color:#fff;margin:0 16px 10px;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between}
.bp-label{font-size:12px;opacity:.6}.bp-price{font-size:20px;font-weight:900}
.btn-shop{display:flex;margin:0 16px 16px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;min-height:48px;align-items:center;justify-content:center;width:calc(100% - 32px)}
.btn-shop.no-link{background:var(--gray3);color:var(--gray5)}
.dlg-circ-drawing{height:260px;background:var(--gray1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.dlg-circ-drawing img{width:100%;height:100%;object-fit:contain}
.dlg-circ-label{font-size:10px;color:var(--gray4);letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:14px 16px 2px}
.dlg-circ-name{font-size:24px;font-weight:900;padding:0 16px 6px}
.dlg-circ-desc{font-size:13px;color:var(--gray5);padding:0 16px 14px}
.dlg-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--gray2);margin:0 16px 14px;border-radius:10px;overflow:hidden}
.dig-box{background:var(--white);padding:10px 12px}.dig-val{font-size:15px;font-weight:800}.dig-lbl{font-size:10px;color:var(--gray4);text-transform:uppercase;margin-top:2px}
.dlg-ganadores{padding:0 16px;margin-bottom:14px}
.dg-title{font-size:13px;font-weight:800;color:var(--gray4);letter-spacing:1px;text-transform:uppercase;margin:12px 0 8px}
.dg-chip{background:var(--gray2);border-radius:6px;padding:5px 12px;display:inline-block;margin:3px 4px 3px 0;font-size:12px;font-weight:700}

const NOTICIAS=[
{season:'t3',fecha:'2 Julio 2026',titulo:'Se presenta la nueva temporada: Liga Bici 2026',video:'https://youtu.be/CpIhwlxMx9I',blocks:[{t:'p',text:'La gala de presentación ha confirmado al 100% los 3 nuevos participantes de Liga Bici. Fran Cobos volverá a estar presente en 2026, después de su descalificación en 2024; el 95 se dispone a pelear el campeonato este año. Sergio Bochons, el presentador de la gala 2025, es otra sorpresa este año; el número 21 llega a la liga después de dos años de rumores sobre su participación. Adrián Vera es la mayor revelación: color blanco y su dorsal 14, llega este 2026 para luchar por el número 1. Esto duplica la cantidad de participantes respecto a 2025, y puede conllevar una mayor dificultad a Julian Matei a defender el título.'}]},
{season:'t3',fecha:'17 Agosto 2026',titulo:'Rubén Asensi consigue la victoria en San José',blocks:[{t:'img',src:RAW_BASE+'ruben_sanjose_2026.png'},{t:'p',text:'Arranca la temporada con una victoria de Rubén Asensi en el centro-sur de La Pobla de Vallbona. El 23 logra arrebatarle el trono a Toni García, con una pole, récord mundial y victoria. Tras una carrera intensa por parte de Toni en la primera vuelta y Hugo Castro en la segunda, Rubén ha sabido gestionarse para no dar oportunidades a sus rivales. Con esta suma su séptima victoria y su pole número 13. En segunda posición ha acabado Hugo Castro. El subcampeón del año pasado logra hacer una muy buena carrera y consigue llevarse un segundo puesto antes de ir a su territorio en Andrómeda. Toni García parecía un gran candidato a la victoria, pero su ritmo bajó considerablemente durante la última vuelta; pero aun así lograba un merecido tercer puesto y dejar fuera del podio a Julián Matei, que rompe su racha de 20 podios seguidos.'},{t:'img',src:RAW_BASE+'carrera_sanjose_2026.png'},{t:'p',text:'El número 1 no solo pierde esa racha, también su racha de carreras liderando el campeonato. Tras una decisión de última hora, Matei corrió con la Merida con el propósito de aumentar todavía más su ritmo en carrera, pero el mal estado de las marchas y su mala adaptación han roto su ritmo totalmente. Mientras, Adrián Vera y Sergio Bochons han quedado en 5.ª y 6.ª posición respectivamente después de que en las primeras curvas los veteranos desaparecieran. Aunque están a pocos puntos detrás de Julián Matei, Bochons y Vera admiten que el ritmo es imposible de mantener en estas primeras carreras, y que van a necesitar mejorar en muchos aspectos para poder llegar a entrar en algún podio o acercarse a una victoria.'}]},
{season:'t3',fecha:'24 Agosto 2026',titulo:'Toni García regresa a lo más alto del podio',blocks:[{t:'img',src:RAW_BASE+'toni_andromeda_2026.png'},{t:'p',text:'Después de casi cumplirse casi un año desde San José 2025, Toni García logra ganar al fin otra carrera con su nueva bici BH, y esta vez en Andrómeda. Circuito sagrado por la tensión e historia que tiene este trazado. El número 7 ha logrado mantener el ritmo de principio a fin, logrando una remontada en la última vuelta a lo Hugo 2025. Hugo Castro vuelve a quedar en segunda posición por segundo año consecutivo; el 25 confiesa haberlo dado todo contra Matei y con la repentina aparición de García, a Castro se le ha hecho imposible pelear la primera posición. Julian Matei lidera prácticamente la carrera entera, pero su resistencia se desmorona casi al final. Hugo y Toni aún han tenido tiempo para sacarle a Matei más de 5 segundos al final. El campeón culpa sobre todo a las pasadas prácticas del sábado 21, por la sobrecarga excesiva en las piernas y exige un cambio en la elaboración de las carreras.'},{t:'img',src:RAW_BASE+'carrera_andromeda_2026.png'},{t:'p',text:'Las Scott han sufrido en Andrómeda como nunca. La mejor marca considerada por muchos en los años anteriores ha tenido un lunes oscuro en Maravisa tras el mal rendimiento de Rubén Asensi y Sergio Bochons. Rubén queda fuera del podio por segunda vez en la historia. El 23 admite que no ha podido seguir el ritmo de ninguno de los 3 en la cabeza de carrera, solo ha podido conservar una cuarta posición que no le deja muy lejos de los nuevos líderes de la liga. Bochons ha logrado su primera gran mejora. En los tiempos el 21 ha podido marcar un 1\'41.44", un tiempo que hasta hace unos días nunca se había superado. Sergio aún con la evidente falta de experiencia ha podido marcar un grandísimo tiempo a escasas milésimas de Asensi, y además ha logrado aguantar toda la primera vuelta a menos de 7 segundos de los veteranos.'}]},
{season:'t2',fecha:'Octubre 2025',titulo:'Julian Matei bicampeón',blocks:[{t:'p',text:'Con la victoria en Vista Calderona, Julian Matei se proclamó campeón de la Temporada 2.'}]},
{season:'t2',fecha:'18 Noviembre 2025',titulo:'Normas contra el invierno',blocks:[{t:'p',text:'Las últimas carreras se harán en Diciembre, un més frío, y por lo tanto sera obligatorio llevar sudadera por si acaso, además también es recomendado llevar braga y guantes, lo último muy recomendado debido al mal rato que se puede llegar a pasar con el viento frío en rectas de velocidad, y con el dolor de cambiar marchas o frenar puede ser una desventaja en alguna que otra carrera. No es obligatorio, pero podra serlo para el año que viene, no el abrigarse, sino la protección. Rodilleras, coderas o muñequeras, no son obligadas, pero se pide porfavor que, en caso de tenerlas a mano se traigan por lo menos a circuitos peligrosos como Llíria o Barranquet. Liga Bici no se hace responsables de lesiones o fracturas.'}]},
{season:'t2',fecha:'24 Noviembre 2025',titulo:'Faltan 4 días para el siguiente fin de semana',blocks:[{t:'p',text:'Y se dará comienzo a las últimas 4 carreras empezando por Llíria. Después de casi un més entero sin ninguna carrera, ha llegado a su fin la primera evaluación para todos los participantes. Y por lo tanto, se hará una votación para realizar Llíria el sabado 29 o domingo 30. Se tienen programadas 11 carreras, dos más que el año pasado. Se correrá este fin de semana en el circuito de Lloma Llarga en las puertas de la capital de la comarca. Mientras que el Barranquet y Maravisa, se realizarán el dáa 6 y 8 respectivamente. Finalmente se dará el cierre a la segunda temporada en el circuito de Vista Calderona el fin de semana del 13/14. Donde también se celebrará la gala de premios.'}]},
{season:'t2',fecha:'30 Noviembre 2025',titulo:'Rubén Asensi gana en la capital',blocks:[{t:'img',src:RAW_BASE+'lliria_ruben.png'},{t:'p',text:'Rubén Asensi completa a la perfección la carrera número 8 del calendario, carrera que además era la última que contaban puntos, y el número 23 ha podido hacerse con todos ellos. Rubén logra llevarse 15 puntos y ponerse segundo en la clasificación general, a tan solo 8 puntos de Julian Matei.'},{t:'img',src:RAW_BASE+'lliria_hugo.png'},{t:'p',text:'Daniel quedaría en segundo lugar después de rendirse contra el cansancio y casi dejandole oportunidad a Hugo, que llegó unos pocos metros detras del número 1. Toni García mantiene su racha de mala suerte, con el fallo de la Mérida, despúes de que en el tiempo de prácticas se identificara un problema con la cadena. El 7 pone como su primera prioridad encontar cuanto antes una bici que le permita correr.'}]},
{season:'t2',fecha:'6 Diciembre 2025',titulo:'Julian conquista el Barranquet de nuevo',blocks:[{t:'img',src:RAW_BASE+'barranquet_matei1.png'},{t:'p',text:'Julian Matei hace realidad las pesadillas de sus rivales, y hace un pleno en el Barranquet. Tanto en los tiempos como en la carrera el número uno ha quedado por delante. Esta victoria deja a 13 puntos al segundo puesto, empatado por Hugo Castro y Rubén Asensi, dejandoles muy pocas posibilidades de convertirse en los nuevos campeones de liga este año.'},{t:'img',src:RAW_BASE+'barranquet_matei2.png'},{t:'p',text:'Julian ha batido el récord de la pista por más de 14 segundos, y ha quedado por delante de el número 69, por tan solo 8 centésimas de segundo. Durante la carrera ha podido aprovechar las peleas por la segunda posición, para alejarse y llegar tranquilo a la meta. Las matemáticas dicen que aún hay esperanza, las probabilidades no. Daniel Matei necesita quedar último en las dos carreras restantes y Rubén o Hugo primero para quitarle el liderazgo de las manos.'}]},
{season:'t2',fecha:'6 Diciembre 2025',titulo:'Un minuto para el Barranquet',video:'https://youtu.be/h4bkAKjMESM',blocks:[{t:'p',text:'Barranquet es ahora considerado uno de los mejores circuitos de la liga bici, pero aún no se sabe si la mejor carrera de esta segunda temporada. Este circuito nos ha dejado las cosas claras, y la lucha por la liga casi definida. Es velocidad, saber trazar y cambiar bien marchas, un jefe final. Y para ganar se debe aplicar todo lo aprendido desde el inicio. El Barranquet volvera a ser una carrera para la liga bici temporada 3, que se celebrará el proximo año 2026.'}]},
{season:'t2',fecha:'7 Diciembre 2025',titulo:'Julian puede ser campeón en Maravisa',blocks:[{t:'img',src:RAW_BASE+'maravisa_matei.png'},{t:'p',text:'Julian Matei puede coronarse de nuevo como campeón de la liga en Sierra Espada. El mismo circuito en el que gano la liga 2024. Según los cálculos, ahora mismo Rubén Asensi y Hugo Castro tienen 87 puntos, y por lo tanto lo máximo que pueden conseguir ambos son 111 puntos (ganando las dos últimas carreras). Si el número 1 logra ganar en Maravisa el próximo lunes y sumar 112 puntos, se hará inalcanzable y por lo tanto sera proclamado campeón de liga en las calles de Sierra Espada. Es decir si Matei sera campeón antes de la última carrera solo y exclusivamente si gana la décima carrera del calendario.'}]},
{season:'t2',fecha:'7 Diciembre 2025',titulo:'Toni García estrenará bici en la temporada 3',blocks:[{t:'img',src:RAW_BASE+'bmpro_toni.png'},{t:'p',text:'Toni García dice adiós definitivamente a su B-Pro, una bici que le ha acompañado dos temporadas y con la que ha podido ganar en San José 2025. Para la siguinte temporada 3, que se dará el año que viene, Toni alerta a sus rivales su nuevo estreno con una Monty. Incluso puede llegar ha hacer debut con ella, en la carrear de Vista Calderona de 2025. El número 7 espera cambiar sus resultados para el año que viene, y poder ganar más de una carrera.'}]},
{season:'t2',fecha:'8 Diciembre 2025',titulo:'Hugo Castro arrasa en Sierra Espada',blocks:[{t:'img',src:RAW_BASE+'espada_hugo1.png'},{t:'p',text:'Tras la mala fama que recibió este circuito la temporada pasada, Hugo Castro a logrado ganar aquí de una forma especatacular. Maravisa norte ha sido una locura de carrera, todos los participantes la han liderado menos Julian Matei. Han habido todo tipo de adelantamientos y rivalidades en pista, y se ha convertido en una de las mejores corridas del año. Ante todo esto, el número 69 se ha hecho con su tercera victoria de la temporada.'},{t:'img',src:RAW_BASE+'espada_hugo2.png'},{t:'p',text:'A Matei se le escapa el campeonato en Sierra Espada, después de su tercer puesto, él mismo admitiría la falta de resistencia que necesita en pistas como lo es Maravisa. Rubén Asensi acaba segundo ya sin posibilidad alguna de ganar la liga, pero aún con esperanzas de ser subcampeón. Toni García sorprende a toda la liga, el número 7 se empieza a adaptar a la Mérida en su último encuentro con ella, y logra tal vez su tercera gran carrera, después de San José y Andrómeda. Toni amenaza con su buena capacidad de adaptación y con su nueva bici para el año que viene.'}]},
{season:'t2',fecha:'11 Diciembre 2025',titulo:'Se dificulta el último encuentro de la temporada',blocks:[{t:'p',text:'Se ha confirmado la presencia de lluvias para este último fin de semana de encuentro donde se cerrara por completo la temporada 2. Se cree que la lluvia parará a las 10am y dejará tiempo de sobra para realizar la carrera de Vista Calderona, pero aun así hay posibilidades de que algún participante no se pueda presentar o que se llegue a cancelar, como sucedió el año pasado.'}]},
{season:'t2',fecha:'13 Diciembre 2025',titulo:'Julian Matei se hace con todo',blocks:[{t:'img',src:RAW_BASE+'vista_matei1.png'},{t:'p',text:'Julian Matei consolida su 5 victoria esta temporada en Vista Calderona tras una carrera de puro control y cálculo. El número 1 ha arrasado en la urbanización roja tras dejar fatigado en la segunda vuelta a Rubén Asensi, y a podido mantener una distancia que le ha permitido lograr una de las victorias más limpias de la temporada. Julian ha realizado historia este 13 de diciembre. Ha subido el record de victorias en una sola temporada a 5. Y se ha convertido por segunda vez, campeón de liga bici.'},{t:'img',src:RAW_BASE+'vista_matei2.png'},{t:'p',text:'Tras este final de victoria, ha dejado el marcador con 119 puntos. Rubén Asensi ha acabado 2ndo de nuevo con malas sensaciones y con cosas que mejorar para la temporada que viene. Mientras que Toni García ha vuelto a conseguir un podio gracias en parte a la ausencia de Hugo Castro, que no ha podido estar presente por temas personales. El número 7 corría en Vista Calderona despidendose para siempre de su bici B-Pro, que lo ha estado acompañando estas 2 últimas temporadas.'}]},
{season:'t2',fecha:'13 Diciembre 2025',titulo:'Fin de la temporada 2',blocks:[{t:'img',src:RAW_BASE+'punte_bici.png'},{t:'p',text:'Tras la gala finalizada, se da cierre total a la temporada 2 de liga bici. Temporada que ha sido superior en casi todos los aspectos a la primera edición. Julian Matei se hace de nuevo con la corona, y acaba la última carrera liderando la clasificación general, con 119 puntos, 32 más de los que consiguió en 2024. Ha ganado 5 de las 11 carreras, lo cual es un grandisimo logro. Hugo Castro, ha sorprendido por todo lo alto a todos los veteranos que pelearon 2024. Ha sido el mayor rival de Matei esta temporada, robandole algunas victorias y siendo un obstaculo complicado para mantener el liderazgo. El número 69 ha acabado empatando el segundo puesto con Rubén Asensi, dejandole a el como subcampeón por sus 3 victorias, superiores a las 2 que ha conseguido el número 23.'},{t:'img',src:RAW_BASE+'gala_bici.png'},{t:'p',text:'Rubén Asensi ha empeorado notablemente su constancia este año. Julian no reconocía al mismo Rubén que casi le ganó en 2024, este año ha ganado la mitad de carreras que ganó el año anterior. Pero aun asi nos a dejado con buenas peleas y a demostrado ser un rival díficil en pista. Toni García ha quedado en último lugar, el número 7 ha vivido su peor temporada debido al problema del mal rendimiento de su bicicleta. Parecía que podria tener oportunidad este año, tras su victoria en San José. Pero poco a poco la B-Pro ha demostrado ser un rival más para Toni. Es por eso que desde aquí tambien confirmamos su debut con una nueva bici para la siguiente edición en 2026.'}]},
{season:'t2',fecha:'30 Diciembre 2025',titulo:'Confirmada la temporada 3 de liga bici',blocks:[{t:'img',src:RAW_BASE+'temporada3_2026.png'},{t:'p',text:'En la gala se ha confirmado, el año siguiente 2026, se celebrará la tercera edición de liga bici, es decir, habrá otra persona a parte de Julian que podrá proclamarse campeón, o a lo mejor no. Los participantes de la temporada 2 han confirmado su asistencia para el año siguiente. Y hay dos opciones que se han planteado: Hacer una sola temporada en 2026, que comience a finales de verano y abarque hasta halloween (calidad). O que su celebren la tercera y cuarta edición, es decir, dos temporadas en 2026 (cantidad). ¿Es mejor calidad o cantidad?'}]}
];

function zonaBadge(z){var m={tranquilo:'tag-tranquilo',coches:'tag-coches',peatones:'tag-peatones'};var l={tranquilo:'Tranquilo',coches:'Zona coches',peatones:'Zona peatones'};return '<span class="ci-tag '+m[z]+'">'+(l[z]||z)+'</span>';}

function getDorsal(r){return(r.dorsales&&r.dorsales[curSeason]!=null)?r.dorsales[curSeason]:r.dorsal;}

function riderName(id){return RIDERS[id]?RIDERS[id].first+' '+RIDERS[id].last:'?';}
function circSVG(id){var c=CIRC_SVGS[id]||{color:'#888',path:'M 50 85 L 20 55 L 80 15 L 160 20 L 190 60 L 150 90 Z',dot:'M 50 85'};var p=c.dot.split(' ');return '<svg viewBox="0 0 210 105" style="max-width:100%;max-height:100%"><rect width="210" height="105" fill="#f8f8f8" rx="6"/><path d="'+c.path+'" fill="none" stroke="'+c.color+'" stroke-width="4.5" stroke-linejoin="round"/><circle cx="'+p[1]+'" cy="'+p[2]+'" r="6" fill="'+c.color+'"/></svg>';}
function calcDevRange(pl,mn,mx){return{subida:(2.167*pl/mx).toFixed(1),velocidad:(2.167*pl/mn).toFixed(1),rango:((2.167*pl/mn)-(2.167*pl/mx)).toFixed(1)};}

if(race){raceHtml='<div class="rc-wrap"><div class="rc-title">Resultado de carrera · '+SEASONS[curSeason].year+'</div>';
race.forEach(function(row){var col=riderColor(row.r);
raceHtml+='<div class="rc-row"><div class="rc-pos" style="border-left-color:'+col+'">'+row.p+'</div><div class="rc-name">'+riderName(row.r).toUpperCase()+'</div><div class="rc-dorsal" style="background:'+col+';color:'+riderText(row.r)+'">'+getDorsal(RIDERS[row.r])+'</div><div class="rc-time'+(row.p===1?' red':'')+'">'+row.t+'</div><div class="rc-pts" style="border-color:'+col+'">+'+row.pts+'</div></div>';});
raceHtml+='</div>';}
var predHtml='';
if(curSeason==='t3'&&PRED_T3[id]){var P=PRED_T3[id];
predHtml='<div class="pred-box"><h4>🤖 Predicción IA</h4>';
P.pred.forEach(function(rid,i){predHtml+='<div class="pred-row"><span class="pred-pos">'+(i+1)+'º</span><span class="pred-name" style="color:'+riderColor(rid)+'">'+riderName(rid)+'</span></div>';});
predHtml+='<div class="pred-razon">📊 '+P.razon+'</div><div class="pred-detalle">🔎 '+P.detalle+'</div></div>';
if(CONSEJOS_T3[id])predHtml+='<div class="consejo-box"><h4>⚙️ Consejos de marcha (mono / bi / tri plato)</h4>'+CONSEJOS_T3[id]+'</div>';}
var times=(TIMES[id]||[]).filter(function(t){return yearAllowed(t.y,t.pre);});
var timesHtml='';
if(times.length){timesHtml='<div style="padding:0 16px 14px"><div class="dg-title">Tiempos ('+(curSeason==='t1'?'2024':curSeason==='t2'?'2024-2025':'2024-2026 + pretemporada')+')</div>';
times.forEach(function(t,i){var col=riderColor(t.r);
timesHtml+='<div class="tt-row"><div class="tt-dorsal" style="background:'+col+';color:'+riderText(t.r)+'">'+t.d+'</div><div class="tt-time'+(i===0?' red':'')+'">'+t.t+'</div><div class="tt-year" style="border-color:'+col+'">'+t.y+(t.pre?' · PRE':'')+'</div></div>';});
timesHtml+='</div>';}
var elevHtml='<div class="elev-strip"><span>⬇️ Mín '+c.altMin+' m</span><span>➖ Media '+elevMedia(c)+' m</span><span>⬆️ Máx '+c.altMax+' m</span></div>';
openDialog('<div class="dlg-circ-label">CIRCUITO</div><div class="dlg-circ-drawing"><img src="'+circImg(c)+'" onerror="this.parentElement.innerHTML=\''+circSVG(c.id).replace(/'/g,"\\'")+'\'"></div><div class="dlg-circ-name">'+c.name+'</div><div class="dlg-circ-desc">'+c.desc+'</div>'+elevHtml+'<div class="dlg-info-grid"><div class="dig-box"><div class="dig-val">'+c.distancia+' m</div><div class="dig-lbl">Distancia</div></div><div class="dig-box"><div class="dig-val">'+(c.curvasNorm+c.curvasPelig)+'</div><div class="dig-lbl">Curvas</div></div><div class="dig-box"><div class="dig-val">'+(c.riesgos||'-')+'</div><div class="dig-lbl">Riesgos</div></div><div class="dig-box"><div class="dig-val">'+(c.homePilot||'-')+'</div><div class="dig-lbl">Casa de</div></div></div>'+predHtml+'<div class="dlg-ganadores"><div class="dg-title">Ganadores</div>'+win+'</div>'+raceHtml+timesHtml+'<div class="dlg-actions"><button class="btn-back" onclick="closeDialog()">Volver</button>'+earth+'</div>');}

document.getElementById('dialog-close').onclick=closeDialog;
document.getElementById('detail-dialog').onclick=function(e){if(e.target===this)closeDialog();};
document.querySelectorAll('.nav-button').forEach(function(b){b.onclick=function(){curView=b.dataset.view;render();};});
render();
</script>
</body>
</html>
